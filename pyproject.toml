[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "story-projection-onto"
version = "0.1.0"
description = "Active query-dependent temporal ontology construction research software"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
authors = [{name = "StoryProjectionOnto contributors"}]
dependencies = [
  "pydantic>=2.10,<3",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
study = [
  "fastapi>=0.115,<1",
  "leidenalg>=0.10,<1",
  "matplotlib>=3.10,<4",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "psutil>=6.1,<8",
  "python-igraph>=0.11,<1",
  "reportlab>=4.2,<5",
  "scipy>=1.14,<2",
  "spacy>=3.8,<4",
  "uvicorn>=0.34,<1",
]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
story-projection-onto = "story_projection_onto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/story_projection_onto"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires the controlled RunPod GPU environment",
  "integration: spans multiple package components",
  "property: bounded Hypothesis property test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

